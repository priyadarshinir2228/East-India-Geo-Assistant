<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Query flow</title><desc id="d">Eight steps: screen, detect entities, graph-hybrid search, rerank, add facts, generate, confidence, answer or abstain. Refused requests stop at step 1.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<style>  .bg{fill:#fcfcfb}
  .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0b0b0b}
  .h{font-size:20px;font-weight:700}
  .col{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#52514e}
  .b{font-size:13px;font-weight:650}
  .s{font-size:11.5px;fill:#52514e}
  .xs{font-size:10.5px;fill:#6e6d68}
  .box{fill:#ffffff;stroke:#d6d5d0;stroke-width:1}
  .lane{fill:#f3f2ef}
  .c1{fill:#2a78d6}.c2{fill:#eb6834}.c3{fill:#1baf7a}.c4{fill:#eda100}.c5{fill:#e87ba4}.c7{fill:#6250d6}.c8{fill:#e34948}
  .k1{stroke:#2a78d6}.k2{stroke:#eb6834}.k3{stroke:#1baf7a}.k4{stroke:#eda100}.k5{stroke:#e87ba4}.k7{stroke:#6250d6}.k8{stroke:#e34948}
  .line{fill:none;stroke:#9a9993;stroke-width:1.6}
  .flow{fill:none;stroke-width:2;stroke-dasharray:6 6;animation:dash 1.1s linear infinite}
  .ah{fill:#9a9993}
  @keyframes dash{to{stroke-dashoffset:-12}}
  @media (prefers-color-scheme:dark){
    .bg{fill:#1a1a19}.t{fill:#f0efec}.col{fill:#c3c2b7}.s{fill:#c3c2b7}.xs{fill:#a3a29b}
    .box{fill:#242423;stroke:#3d3d3a}.lane{fill:#202020}
    .c1{fill:#3987e5}.c2{fill:#d95926}.c3{fill:#199e70}.c4{fill:#c98500}.c5{fill:#d55181}.c7{fill:#9085e9}.c8{fill:#e66767}
    .k1{stroke:#3987e5}.k2{stroke:#d95926}.k3{stroke:#199e70}.k4{stroke:#c98500}.k5{stroke:#d55181}.k7{stroke:#9085e9}.k8{stroke:#e66767}
    .line{stroke:#6e6d68}.ah{fill:#6e6d68}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes on{0%{opacity:0}3%{opacity:1}12.5%{opacity:1}15%{opacity:0}100%{opacity:0}}.hl{fill:none;stroke-width:2.5;opacity:0;animation:on 9.6s linear infinite}</style>
<rect class="bg" width="1000" height="500" rx="14"/>
<text class="t t h" x="24" y="40" text-anchor="start">What happens when you ask a question</text>
<text class="t s" x="24" y="62" text-anchor="start">app/pipeline.py: answer(). One loop is one question; the highlighted step is the one running.</text>
<path class="flow k1" d="M238,174.0 L266,174.0" marker-end="url(#ah)"/>
<path class="flow k1" d="M482,174.0 L510,174.0" marker-end="url(#ah)"/>
<path class="flow k1" d="M726,174.0 L754,174.0" marker-end="url(#ah)"/>
<path class="flow k1" d="M863.0,238 L863.0,298" marker-end="url(#ah)"/>
<path class="flow k1" d="M756,364.0 L728,364.0" marker-end="url(#ah)"/>
<path class="flow k1" d="M512,364.0 L484,364.0" marker-end="url(#ah)"/>
<path class="flow k1" d="M268,364.0 L240,364.0" marker-end="url(#ah)"/>
<rect class="box" x="24" y="110" width="214" height="128" rx="8"/>
<rect class="c8" x="24" y="110" width="4" height="128" rx="2"/>
<text class="t b" x="38" y="131" text-anchor="start">1  Screen the request</text>
<text class="t s" x="38" y="149" text-anchor="start">write, secret or off-topic</text>
<text class="t s" x="38" y="165" text-anchor="start">→ refused before retrieval</text>
<text class="t xs" x="38" y="228" text-anchor="start">app/safety.py</text>
<rect class="hl k1" x="21" y="107" width="220" height="134" rx="10" style="animation-delay:0.00s"/>
<rect class="box" x="268" y="110" width="214" height="128" rx="8"/>
<rect class="c1" x="268" y="110" width="4" height="128" rx="2"/>
<text class="t b" x="282" y="131" text-anchor="start">2  Detect entities</text>
<text class="t s" x="282" y="149" text-anchor="start">schools, boards, roads,</text>
<text class="t s" x="282" y="165" text-anchor="start">circulars named in the question</text>
<text class="t xs" x="282" y="228" text-anchor="start">retrieve/entities.py</text>
<rect class="hl k1" x="265" y="107" width="220" height="134" rx="10" style="animation-delay:1.20s"/>
<rect class="box" x="512" y="110" width="214" height="128" rx="8"/>
<rect class="c1" x="512" y="110" width="4" height="128" rx="2"/>
<text class="t b" x="526" y="131" text-anchor="start">3  Graph-hybrid search</text>
<text class="t s" x="526" y="149" text-anchor="start">BM25 50 + kNN 50 + graph 2 hops</text>
<text class="t s" x="526" y="165" text-anchor="start">fused with RRF k=60, graph ×0.5</text>
<text class="t xs" x="526" y="228" text-anchor="start">retrieve/search.py</text>
<rect class="hl k1" x="509" y="107" width="220" height="134" rx="10" style="animation-delay:2.40s"/>
<rect class="box" x="756" y="110" width="214" height="128" rx="8"/>
<rect class="c3" x="756" y="110" width="4" height="128" rx="2"/>
<text class="t b" x="770" y="131" text-anchor="start">4  Rerank</text>
<text class="t s" x="770" y="149" text-anchor="start">bge-reranker-base on top 20</text>
<text class="t s" x="770" y="165" text-anchor="start">keep top_k = 5 passages</text>
<text class="t xs" x="770" y="228" text-anchor="start">retrieve/rerank.py</text>
<rect class="hl k1" x="753" y="107" width="220" height="134" rx="10" style="animation-delay:3.60s"/>
<rect class="box" x="756" y="300" width="214" height="128" rx="8"/>
<rect class="c4" x="756" y="300" width="4" height="128" rx="2"/>
<text class="t b" x="770" y="321" text-anchor="start">5  Add facts</text>
<text class="t s" x="770" y="339" text-anchor="start">graph edges + GeoServer WFS</text>
<text class="t s" x="770" y="355" text-anchor="start">near = 300 m in EPSG:32646</text>
<text class="t xs" x="770" y="418" text-anchor="start">app/pipeline.py</text>
<rect class="hl k1" x="753" y="297" width="220" height="134" rx="10" style="animation-delay:4.80s"/>
<rect class="box" x="512" y="300" width="214" height="128" rx="8"/>
<rect class="c7" x="512" y="300" width="4" height="128" rx="2"/>
<text class="t b" x="526" y="321" text-anchor="start">6  Generate</text>
<text class="t s" x="526" y="339" text-anchor="start">Qwen2.5-3B, temp 0, seed 42</text>
<text class="t s" x="526" y="355" text-anchor="start">JSON: answer + citations</text>
<text class="t xs" x="526" y="418" text-anchor="start">common/llm.py</text>
<rect class="hl k1" x="509" y="297" width="220" height="134" rx="10" style="animation-delay:6.00s"/>
<rect class="box" x="268" y="300" width="214" height="128" rx="8"/>
<rect class="c5" x="268" y="300" width="4" height="128" rx="2"/>
<text class="t b" x="282" y="321" text-anchor="start">7  Confidence</text>
<text class="t s" x="282" y="339" text-anchor="start">logistic regression on p_top,</text>
<text class="t s" x="282" y="355" text-anchor="start">margin, agree, lp_mean</text>
<text class="t xs" x="282" y="418" text-anchor="start">retrieve/confidence.py</text>
<rect class="hl k1" x="265" y="297" width="220" height="134" rx="10" style="animation-delay:7.20s"/>
<rect class="box" x="24" y="300" width="214" height="128" rx="8"/>
<rect class="c3" x="24" y="300" width="4" height="128" rx="2"/>
<text class="t b" x="38" y="321" text-anchor="start">8  Answer or abstain</text>
<text class="t s" x="38" y="339" text-anchor="start">abstain if confidence &lt; 0.5</text>
<text class="t s" x="38" y="355" text-anchor="start">or the model says it can&#x27;t</text>
<text class="t xs" x="38" y="418" text-anchor="start">confidence_model.json</text>
<rect class="hl k1" x="21" y="297" width="220" height="134" rx="10" style="animation-delay:8.40s"/>
<path class="line" d="M70,110 L70,80 L266,80" marker-end="url(#ah)"/>
<rect class="box" x="268" y="66" width="300" height="28" rx="14"/>
<circle class="c8" cx="284" cy="80" r="5"/>
<text class="t s" x="296" y="84" text-anchor="start">Refused instantly: no search, no LLM call</text>
<path class="line" d="M80,428 L80,452" marker-end="url(#ah)"/>
<path class="line" d="M180,428 L180,440 L330,440 L330,452" marker-end="url(#ah)"/>
<rect class="box" x="24" y="454" width="220" height="30" rx="15"/><circle class="c3" cx="42" cy="469" r="5"/>
<text class="t s" x="54" y="473" text-anchor="start">Answer with citations</text>
<rect class="box" x="256" y="454" width="360" height="30" rx="15"/><circle class="c4" cx="274" cy="469" r="5"/>
<text class="t s" x="286" y="473" text-anchor="start">Abstain: “I cannot answer this from the available sources.”</text>
<text class="t xs" x="976" y="473" text-anchor="end">Logged to evidence/requests.jsonl</text>
<circle class="c1" r="6" opacity=".9"><animateMotion dur="9.6s" repeatCount="indefinite" path="M131,174 L375,174 L619,174 L863,174 L863,364 L619,364 L375,364 L131,364" keyPoints="0.0000;0.1475;0.2950;0.4426;0.5574;0.7050;0.8525;1.0000;1" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1" calcMode="linear"/></circle>
</svg>
